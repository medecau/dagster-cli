[project]
name = "dagster-cli"
version = "0.8.1"
description = "A command-line interface for Dagster+"
readme = "README.md"
requires-python = ">=3.10"
authors = [
    {name = "Pedro", email = "me@pdbr.org"}
]
license = "MIT"
license-files = ["LICENSE"]
keywords = ["dagster", "cli", "dagster-plus", "dagster-cloud"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]
dependencies = [
    "typer>=0.9.0",
    "dagster-graphql>=1.8.13",
    "gql[httpx]>=3.5.3",
    "python-dotenv>=1.0.1",
    "rich>=13.0.0",
    "mcp[cli]>=1.2.0",
    "uvicorn>=0.30.0",
]

[project.scripts]
dgc = "dagster_cli.cli:app"

[build-system]
requires = ["uv_build>=0.11.0,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "pytest-asyncio>=0.21.0",
    "ruff>=0.1.0",
    "ty>=0.0.12",
]

[tool.ruff]
line-length = 88

[tool.ruff.lint]
select = [
    "A",
    "ARG",
    "B",
    "C90",
    "COM",
    "DTZ",
    "E",
    "ERA",
    "FBT",
    "FIX",
    "FURB",
    "G",
    "I",
    "ICN",
    "INP",
    "N",
    "PERF",
    "PT",
    "PTH",
    "RET",
    "S",
    "SIM",
    "SLF",
    "T10",
    "T20",
    "TC",
    "TD",
    "TID",
    "UP",
    "W",
    "YTT",
]
ignore = [
    "COM812",   # may conflict with formatter
    "FBT001",   # bool args are required by Typer's Option/Argument pattern
    "FBT002",   # bool default values are idiomatic in this codebase
    "FBT003",   # bool literal in typer.Option() default is required by Typer
    "B008",     # typer.Option() call in default is the Typer pattern
]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = [
    "S101",   # assert is fine in tests
    "SLF001", # accessing private member for mocking
]
"src/dagster_cli/commands/deployment.py" = [
    "PT028",  # def test() is a CLI command, not a pytest test
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
